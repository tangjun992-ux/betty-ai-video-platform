name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · full pytest + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "moto[s3]" pytest aiosqlite
      - name: Full unit / API test suite
        env:
          ENV: test
          DATABASE_URL: "sqlite+aiosqlite:////tmp/ci_tests.db"
        run: pytest tests/ -q --tb=line
      - name: Alembic migrations apply on a fresh DB
        env:
          DATABASE_URL: "sqlite:////tmp/ci_alembic.db"
        run: alembic upgrade head
      - name: Mapping smoke (offline)
        env:
          ENV: test
        run: python scripts/smoke_active_models.py mapping
      - name: Stripe bootstrap dry-run + validate
        env:
          ENV: test
        run: |
          python scripts/bootstrap_stripe_prices.py --dry-run --json-only | python -c "import json,sys; d=json.load(sys.stdin); assert d['mode']=='dry-run'"
          python scripts/bootstrap_stripe_prices.py --validate --json-only
      - name: Staging go-live report (CI structure gate)
        env:
          ENV: test
        run: |
          python scripts/staging_go_live_check.py --json-only | python -c "
          import json,sys
          d=json.load(sys.stdin)
          assert 'go_live_ok' in d and 'next_steps' in d
          assert 'stripe' in d and 'storage' in d
          wh=d.get('stripe',{}).get('webhook_config') or {}
          assert wh.get('endpoint_path')=='/api/v1/billing/stripe/webhook'
          print('staging report structure ok')
          "
      - name: Staging go-live soft gate (dev revenue+media)
        env:
          ENV: development
          STRIPE_API_KEY: sk_test_ci_soft
          STRIPE_WEBHOOK_SECRET: whsec_ci_soft_gate
          STRIPE_PRICE_STARTER_MONTHLY: price_ci_soft
          STRIPE_SUCCESS_URL: http://localhost:3000/billing/success
          STRIPE_CANCEL_URL: http://localhost:3000/pricing
        run: python scripts/staging_go_live_check.py --soft --json-only | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('revenue_ready') and d.get('media_ready'); print('soft gate ok')"
      - name: Phase parity tests (17–25)
        env:
          ENV: test
          DATABASE_URL: "sqlite+aiosqlite:////tmp/ci_phase.db"
        run: pytest tests/test_phase17_yapper.py tests/test_phase18_yapper.py tests/test_phase19_yapper.py tests/test_phase20_yapper.py tests/test_phase21_yapper.py tests/test_phase22_yapper.py tests/test_phase23_yapper.py tests/test_phase24_yapper.py tests/test_phase25_yapper.py -q --tb=line

  frontend:
    name: Frontend · lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  e2e:
    name: Playwright · capability + betty + agent + extract
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start API + Celery worker
        working-directory: backend
        env:
          ENV: development
          DATABASE_URL: "sqlite+aiosqlite:////tmp/e2e.db"
          REDIS_URL: "redis://127.0.0.1:6379/0"
          CELERY_BROKER_URL: "redis://127.0.0.1:6379/1"
          CELERY_RESULT_BACKEND: "redis://127.0.0.1:6379/2"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          celery -A celery_app worker -Q video_q,image_q,pipeline_q,director_q,celery --concurrency=2 --loglevel=warning &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          sleep 3
      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          npm run start -- --port 3000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000 >/dev/null && break; sleep 1; done
      - name: Run Playwright key specs
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npx playwright test e2e/capability.spec.ts e2e/betty.spec.ts e2e/agent.spec.ts e2e/agent-variants.spec.ts e2e/agent-trends.spec.ts e2e/extract.spec.ts e2e/explore.spec.ts e2e/tasks.spec.ts e2e/pricing.spec.ts e2e/billing-success.spec.ts e2e/staging-go-live.spec.ts --reporter=line

  e2e-full-chain:
    name: Playwright · timeline full-chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend + Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start API
        working-directory: backend
        env:
          ENV: development
          DATABASE_URL: "sqlite+aiosqlite:////tmp/e2e-fullchain.db"
          REDIS_URL: "redis://127.0.0.1:6379/0"
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 45); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
      - name: Start frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm run build
          npm run start -- --port 3000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000 >/dev/null && break; sleep 1; done
      - name: Run timeline full-chain spec
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npx playwright test e2e/full-chain.spec.ts --reporter=line
